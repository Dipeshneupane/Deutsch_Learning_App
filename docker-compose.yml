services:
  postgres:
    image: postgres:16
    container_name: german-learning-postgres
    environment:
      POSTGRES_DB: german_learning_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: german-learning-backend
    depends_on:
      - postgres
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/german_learning_app
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5000,http://localhost:5173,http://localhost:8080
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: german-learning-frontend
    depends_on:
      - backend
    environment:
      API_BASE_URL: http://backend:8080/api/v1
      PORT: 8080
    ports:
      - "3000:8080"

volumes:
  postgres_data:
